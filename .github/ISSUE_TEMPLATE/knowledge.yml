name: Sugerir conhecimento
description: Compartilhe uma fonte para a Rubituci aprender.
title: "[Conhecimento]: "
labels: ["knowledge", "needs-review"]
body:
  - type: input
    id: source
    attributes:
      label: Fonte
      description: URL, obra ou dataset.
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Licença
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: O que ela pode aprender?
    validations:
      required: true
  - type: textarea
    id: caveats
    attributes:
      label: Limitações ou vieses
