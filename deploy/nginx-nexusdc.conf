server {
    server_name nexusdc.com.br www.nexusdc.com.br;

    location = /featmed { return 301 /featmed/; }
    location ^~ /featmed/ {
        root /var/www/sites;
        try_files $uri $uri/ /featmed/index.html;
    }
    location ^~ /featmed-api/ {
        proxy_pass https://featmed.com/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host featmed.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /auto { return 301 /auto/; }
    location ^~ /auto/assets/ { alias /opt/mercadolivre-auto/current/.output/public/assets/; access_log off; expires 7d; }
    location ^~ /auto/brand/ { alias /opt/mercadolivre-auto/current/.output/public/brand/; access_log off; expires 7d; }
    location = /auto/favicon.ico { alias /opt/mercadolivre-auto/current/.output/public/favicon.ico; access_log off; }
    location = /auto/robots.txt { alias /opt/mercadolivre-auto/current/.output/public/robots.txt; access_log off; }
    location ^~ /auto/ {
        proxy_pass http://127.0.0.1:9021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /auto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 110M;
        proxy_read_timeout 300s;
    }
    location = /diagnosticoap { return 301 /diagnosticoap/; }
    location ^~ /diagnosticoap/ {
        proxy_pass http://127.0.0.1:9030/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /diagnosticoap;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:9010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/admin.nexusdc.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.nexusdc.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name nexusdc.com.br www.nexusdc.com.br;
    return 301 https://nexusdc.com.br$request_uri;
}
