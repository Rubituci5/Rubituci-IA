version: '3.9'

services:
  # =============================================================================
  # DATABASE
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: entity-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-entity}
      POSTGRES_USER: ${POSTGRES_USER:-entity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-entity} -d ${POSTGRES_DB:-entity}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - entity-network
    restart: unless-stopped

  # =============================================================================
  # REDIS
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: entity-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - entity-network
    restart: unless-stopped

  # =============================================================================
  # BACKEND API
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: entity-api
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - MODEL_PATH=${MODEL_PATH:-./models/generation_000001}
      - TOKENIZER_PATH=${TOKENIZER_PATH:-./tokenizer}
      - INFERENCE_DEVICE=${INFERENCE_DEVICE:-cpu}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-duckduckgo}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OTEL_EXPORTER_PROMETHEUS_PORT=${OTEL_EXPORTER_PROMETHEUS_PORT:-9464}
    volumes:
      - ./models:/app/models:ro
      - ./tokenizer:/app/tokenizer:ro
      - ./logs:/app/logs
    ports:
      - "8000:8000"
      - "9464:9464"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - entity-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # =============================================================================
  # CELERY WORKER (Background tasks)
  # =============================================================================
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: entity-worker
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - MODEL_PATH=${MODEL_PATH:-./models/generation_000001}
      - TOKENIZER_PATH=${TOKENIZER_PATH:-./tokenizer}
      - INFERENCE_DEVICE=${INFERENCE_DEVICE:-cpu}
      - REFLECTION_ENABLED=${REFLECTION_ENABLED:-true}
      - REFLECTION_INTERVAL_SECONDS=${REFLECTION_INTERVAL_SECONDS:-300}
      - CONSOLIDATION_ENABLED=${CONSOLIDATION_ENABLED:-true}
      - CONSOLIDATION_SCHEDULE_CRON=${CONSOLIDATION_SCHEDULE_CRON:-"0 3 * * *"}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./models:/app/models:ro
      - ./tokenizer:/app/tokenizer:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - entity-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # =============================================================================
  # CELERY BEAT (Scheduler)
  # =============================================================================
  beat:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: entity-beat
    command: celery -A worker.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - CONSOLIDATION_SCHEDULE_CRON=${CONSOLIDATION_SCHEDULE_CRON:-"0 3 * * *"}
      - REFLECTION_INTERVAL_SECONDS=${REFLECTION_INTERVAL_SECONDS:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - celery_beat_data:/app/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - entity-network
    restart: unless-stopped

  # =============================================================================
  # FRONTEND (Next.js)
  # =============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: entity-web
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Entity}
      - NODE_ENV=${ENVIRONMENT:-development}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - entity-network
    restart: unless-stopped

  # =============================================================================
  # PROXY (Caddy)
  # =============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: entity-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - entity-network
    restart: unless-stopped

  # =============================================================================
  # PROMETHEUS
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: entity-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - entity-network
    restart: unless-stopped

  # =============================================================================
  # GRAFANA
  # =============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: entity-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - entity-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  entity-network:
    driver: bridge