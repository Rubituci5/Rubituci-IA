global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'entity'
    environment: 'development'

scrape_configs:
  - job_name: 'entity-api'
    static_configs:
      - targets: ['api:9464']
    metrics_path: '/metrics'

  - job_name: 'entity-worker'
    static_configs:
      - targets: ['worker:9464']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

remote_write:
  - url: 'http://prometheus:9090/api/v1/write'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []